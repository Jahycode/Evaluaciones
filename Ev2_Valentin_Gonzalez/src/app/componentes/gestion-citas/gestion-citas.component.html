<form #f="ngForm" (ngSubmit)="onSubmit(f)">
  <ion-list>

    <!-- FRASE -->
    <ion-item>
      <ion-input
        name="frase"
        label="Ingrese Frase"
        labelPlacement="stacked"
        placeholder="Frase"
        required
        minlength="5"
        [(ngModel)]="fraseStr"
        #frase="ngModel">
      </ion-input>
    </ion-item>

    <ion-item lines="none" *ngIf="frase.invalid && (frase.dirty || frase.touched || f.submitted)">
      <ion-text>
        <p *ngIf="frase.errors?.['required']">La frase es obligatoria.</p>
        <p *ngIf="frase.errors?.['minlength']">La frase debe tener al menos 5 caracteres.</p>
      </ion-text>
    </ion-item>

    <!-- AUTOR -->
    <ion-item>
      <ion-input
        name="autor"
        label="Ingrese Autor"
        labelPlacement="stacked"
        placeholder="Autor"
        required
        minlength="2"
        [(ngModel)]="autorStr"
        #autor="ngModel">
      </ion-input>
    </ion-item>

    <ion-item lines="none" *ngIf="autor.invalid && (autor.dirty || autor.touched || f.submitted)">
      <ion-text>
        <p *ngIf="autor.errors?.['required']">El autor es obligatorio.</p>
        <p *ngIf="autor.errors?.['minlength']">El autor debe tener al menos 2 caracteres.</p>
      </ion-text>
    </ion-item>

    <!-- BOTÓN -->
    <ion-item>
      <ion-button type="submit" expand="block" [disabled]="f.invalid">
        Agregar
      </ion-button>
    </ion-item>

  </ion-list>
</form>
