<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button routerLink="/home">
        <ion-icon name="home-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Gestión de Citas</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Gestión de Citas</ion-title>
    </ion-toolbar>
  </ion-header>

  <app-formulario-citas (onCreate)="onNuevaCita()"></app-formulario-citas>

  <ion-list>
    <ion-item-sliding *ngFor="let cita of citas">
      <ion-item>
        <ion-label>
          <h2>"{{ cita.frase }}"</h2>
          <p>- {{ cita.autor }}</p>
        </ion-label>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="eliminarCita(cita.id!)">
          <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>

    <ion-item *ngIf="citas.length === 0">
      <ion-label>
        <p>No hay citas registradas</p>
      </ion-label>
    </ion-item>
  </ion-list>

</ion-content>
